# AI Companion Configuration

user:
  name: "User"
  timezone: "local"        # "local" = this computer's timezone, or e.g. "Asia/Karachi"
  city: ""
  # Needed for prayer times. Example (Karachi): 24.86 / 67.01
  latitude: null
  longitude: null

assistant:
  name: "MD"             # change it and the wake word follows ("hey <name>", "<name>")

llm:
  ollama_url: "http://localhost:11434"
  chat_model: "qwen2.5:1.5b"
  embedding_model: "nomic-embed-text"
  temperature: 0.7
  max_tokens: 400
  keep_alive: "30m"        # keep the chat model loaded (reloading it takes several seconds)
  translate_model: "gemma3:4b"   # English -> Roman Urdu; smaller models translated wrongly in tests

storage:
  memory_db: "data/memory.db"
  screenshots_dir: "data/screenshots"
  logs_dir: "data/logs"
  code_output_dir: "data/code_output"

voice:
  enabled: true
  stt_model_size: "base"   # tiny | base | small | medium — understands your commands
  wake_model_size: "tiny"  # listens for the wake word all day; keep it light so replies stay fast
  tts_engine: "pyttsx3"
  language: "en"           # speech language hint for Whisper ("en", "ur", "hi"; "" = auto-detect)
  input_device: null       # microphone: null = Windows default, or a number/name from --mic-test
  # Wake word: say one of these to talk without pressing anything. Pick a name that isn't an
  # everyday word, so normal conversation doesn't wake the companion.
  wake_enabled: true
  wake_phrases: []         # empty = made from assistant.name; or list your own, e.g. ["hey noor", "noor"]
  voiceprint_enabled: true # only enrolled voices (max 2) can wake me; everyone is accepted until someone enrols
  voiceprint_threshold: 0.5
  wake_sensitivity: 0.82   # 0.6 = wakes easily (more false alarms) .. 0.95 = must be said clearly
  conversation: true       # after the wake word keep listening for more sentences until "bye" / "bas" / silence
  follow_up_seconds: 6     # how long to wait for the next sentence before going back to sleep

notifications:
  enabled: true
  windows_toasts: true     # every notification Windows receives (WhatsApp Desktop, Outlook, Teams, ...)
  browser_tabs: true       # unread counts in open browser tabs — works even if the site's notifications are off
  read_content: true       # read the message text aloud (false = only say which app)
  ignore_apps: ["Microsoft.BingNews", "Widgets", "WindowsAlarms"]

hotkeys:
  enabled: true
  translate: "<ctrl>+<alt>+t"     # translate selected text, or the text under the mouse, into Roman Urdu
  talk: "<ctrl>+<alt>+<space>"    # start listening without saying the wake word
  open_window: "<ctrl>+<alt>+n"   # open MD's window from anywhere

whatsapp:
  message_language: "roman_urdu"  # "roman_urdu" converts English dictation; "as_spoken" keeps it as said
  verify_contact: true            # check the open chat's name on screen before pressing send

# Which browser profile is which account (easier to set on the Accounts page in the browser):
# accounts:
#   youtube:
#     - {label: "NexTube", browser: chrome, profile: "Profile 5"}
#     - {label: "Ruhani Nasheeds", browser: chrome, profile: "Profile 10"}
# WhatsApp contacts (spoken name -> name saved in WhatsApp, optional phone for the exact chat):
# contacts:
#   mama ji: {whatsapp: "Mama Ji", phone: "+923001234567"}

scheduler:
  checkin_time: "09:00"
  wakeup_time: "05:30"
  wakeup_enabled: false
  prayer_reminders_enabled: true
  prayer_method: "KARACHI"   # KARACHI | MUSLIM_WORLD_LEAGUE | UMM_AL_QURA | EGYPTIAN | NORTH_AMERICA | DUBAI | ...
  madhab: "HANAFI"           # HANAFI | SHAFI (affects Asr time)
  prayer_reminder_minutes_before: 10

focus:
  default_minutes: 25
  # Window titles containing any of these words count as distractions during a focus session
  distractions: ["youtube", "facebook", "instagram", "tiktok", "netflix", "twitter", "reddit"]

# Say the routine name (e.g. "work mode") to run all its steps in order
routines:
  work mode:
    - open vs code
    - open gmail
    - start focus for 50 minutes
  good night:
    - what are my goals
    - volume down

accessibility:
  voice_only_mode: false
  auto_screenshot_on_error: true
  context_memory_enabled: true
